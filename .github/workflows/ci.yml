name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Disabled: typescript-eslint doesn't support TypeScript 7 yet and refuses to load.
      # Re-enable once it does: https://github.com/typescript-eslint/typescript-eslint/issues/10940
      # - name: Lint
      #   run: bun run lint

      - name: Type check
        run: bun run typecheck
